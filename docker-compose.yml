services:
  cam2ip-mcp:
    build:
      context: .
      dockerfile: Containerfile
    image: cam2ip-mcp:latest
    container_name: cam2ip-mcp

    # Grant access to the video device. Change the index on both sides if your
    # camera is not /dev/video0; `docker run --rm <image> --list-devices` lists
    # what the container can see.
    devices:
      - /dev/video0:/dev/video0

    # Published ports follow the same variables the server binds to. Compose
    # reads .env for substitution, so changing a port there moves both sides at
    # once -- hardcoding one of them is how you get a container that looks fine
    # in `docker ps` while nothing can reach it.
    ports:
      # cam2ip web UI and MJPEG stream
      - "${CAM2IP_PORT:-56000}:${CAM2IP_PORT:-56000}"
      # MCP endpoint (sse and streamable-http modes)
      - "${MCP_HTTP_PORT:-3000}:${MCP_HTTP_PORT:-3000}"

    # Settings from .env, if present. Everything else falls back to the
    # defaults baked into the image, so only override what you need.
    env_file:
      - path: .env
        required: false

    environment:
      # A compose service is a daemon, so it serves MCP over HTTP: clients
      # connect to http://<host>:3000/mcp. MCP_MODE=stdio only makes sense when
      # the MCP client itself launches the container (`docker run -i`), because
      # stdio needs the client wired to the container's stdin and stdout --
      # nothing is attached to them here.
      - MCP_MODE=${MCP_MODE:-streamable-http}

    restart: unless-stopped
